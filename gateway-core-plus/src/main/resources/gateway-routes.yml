# ========================================
# Muxin Gateway 路由配置文件
# 仅支持 HTTP 协议
# ========================================

# ==================== 功能域配置 ====================
domains:
  # 核心配置域
  core:
    default-timeout: 30000
    max-request-size: 10MB
    max-response-size: 50MB

  # 线程池配置域
  thread-pools:
    business:
      core-size: 16
      max-size: 32
      queue-capacity: 1000
      keep-alive: 60000
  
  # 服务器配置域
  servers:
    http:
      port: 8080
      max-content-length: 10MB
      keep-alive: true
      compression: true
    management:
      port: 8081
      enabled: true
  
  # 连接池配置域
  connection-pools:
    default:
      max-connections-per-host: 100
      max-idle-connections: 50
      connection-timeout: 5000
      idle-timeout: 60000

# ==================== 服务定义（仅HTTP协议） ====================
services:
  # 用户服务（CONFIG类型）
  - id: user-service-001
    name: "user-service"
    type: CONFIG
    supported-protocols: [HTTP]
    addresses:
      - uri: "http://user-service-1:8080"
        weight: 100
        metadata:
          zone: "zone-a"
          version: "v1.0"
      - uri: "http://user-service-2:8080"
        weight: 100
        metadata:
          zone: "zone-b"
          version: "v1.0"
    health-check:
      enabled: true
      interval: 30000
      timeout: 5000
      path: "/health"
  
  # 订单服务（CONFIG类型）
  - id: order-service-001
    name: "order-service"
    type: CONFIG
    supported-protocols: [HTTP]
    addresses:
      - uri: "http://order-service-1:8080"
        weight: 100
        metadata:
          zone: "zone-a"
      - uri: "http://order-service-2:8080"
        weight: 100
        metadata:
          zone: "zone-b"
    health-check:
      enabled: true
      interval: 30000
      timeout: 5000
      path: "/health"
  
  # 文件服务（CONFIG类型)
  - id: file-service-001
    name: "file-storage-service"
    type: CONFIG
    supported-protocols: [HTTP]
    addresses:
      - uri: "http://file-service-1:8080"
        weight: 100
        metadata:
          storage-type: "local"
          capacity: "1TB"
      - uri: "http://file-service-2:8080"
        weight: 100
        metadata:
          storage-type: "oss"
          capacity: "unlimited"
    health-check:
      enabled: true
      interval: 30000
      timeout: 10000
      path: "/health"
  
  # 库存服务（CONFIG类型）
  - id: inventory-service-001
    name: "inventory-service"
    type: CONFIG
    supported-protocols: [HTTP]
    addresses:
      - uri: "http://inventory-service-1:8080"
        weight: 100
        metadata:
          zone: "zone-a"
      - uri: "http://inventory-service-2:8080"
        weight: 100
        metadata:
          zone: "zone-b"
    health-check:
      enabled: true
      interval: 30000
      timeout: 5000
      path: "/health"
  
  # SDE管理服务（CONFIG类型）
  - id: sde-admin-service-001
    name: "sde-admin-service"
    type: CONFIG
    supported-protocols: [HTTP]
    addresses:
      - uri: "http://127.0.0.1:9180"
        weight: 100
        metadata:
          environment: "local"
    health-check:
      enabled: false
  
  # 默认服务（CONFIG类型）
  - id: default-service-001
    name: "default-handler-service"
    type: CONFIG
    supported-protocols: [HTTP]
    addresses:
      - uri: "http://default-service:8080"
        weight: 100
        metadata:
          type: "fallback"
          purpose: "default-handler"
    health-check:
      enabled: false

# ==================== 路由配置（仅HTTP协议） ====================
routes:
  # ========== 用户服务路由 ==========
  - id: user-service-route
    name: "用户服务"
    description: "用户管理相关API"
    order: 100
    enabled: true
    
    # 服务引用
    service-ref: user-service-001
    
    # 协议配置
    protocol: HTTP
    
    # 路由匹配断言
    predicates:
      - type: PATH
        config:
          pattern: "/api/users/**"
      - type: METHOD
        config:
          methods: [GET, POST, PUT, DELETE]
    
    # 负载均衡配置
    load-balance:
      strategy: ROUND_ROBIN
    
    # 过滤器配置
    filters:
      - type: REQUEST_LOG
        order: 100
        enabled: true
      - type: AUTH
        order: 200
        enabled: true
        config:
          auth-type: "JWT"
          secret-key: "${JWT_SECRET:muxin-gateway-secret}"
    
    # 超时配置
    timeouts:
      connection: 5000
      request: 30000
      total: 60000
    
    # 路由元数据
    metadata:
      business-domain: "user-management"
      service-version: "1.0.0"
  
  # ========== 订单服务路由 ==========
  - id: order-service-route
    name: "订单服务"
    description: "订单管理API"
    order: 200
    enabled: true
    
    # 服务引用
    service-ref: order-service-001
    
    # 协议配置
    protocol: HTTP
    
    # 路由匹配断言
    predicates:
      - type: PATH
        config:
          pattern: "/api/orders/**"
      - type: METHOD
        config:
          methods: [GET, POST, PUT, DELETE]
    
    # 负载均衡配置
    load-balance:
      strategy: ROUND_ROBIN
    
    # 过滤器配置
    filters:
      - type: REQUEST_LOG
        order: 100
        enabled: true
      - type: AUTH
        order: 200
        enabled: true
    
    # 超时配置
    timeouts:
      connection: 3000
      request: 20000
      total: 40000
    
    # 路由元数据
    metadata:
      business-domain: "order-management"
  
  # ========== 文件服务路由 ==========
  - id: file-service-route
    name: "文件服务"
    description: "文件上传下载"
    order: 500
    enabled: true
    
    # 服务引用
    service-ref: file-service-001
    
    # 协议配置
    protocol: HTTP
    
    # 路由匹配断言
    predicates:
      - type: PATH
        config:
          pattern: "/api/files/**"
      - type: METHOD
        config:
          methods: [GET, POST, PUT, DELETE]
    
    # 负载均衡配置
    load-balance:
      strategy: LEAST_CONNECTIONS
    
    # 过滤器配置
    filters:
      - type: REQUEST_LOG
        order: 100
        enabled: true
      - type: AUTH
        order: 200
        enabled: true
    
    # 超时配置（文件上传需要更长时间)
    timeouts:
      connection: 10000
      request: 300000
      total: 600000
    
    # 路由元数据
    metadata:
      business-domain: "file-storage"
      max-file-size: "100MB"
  
  # ========== 库存服务路由 ==========
  - id: inventory-service-route
    name: "库存服务"
    description: "库存管理API"
    order: 700
    enabled: true
    
    # 服务引用
    service-ref: inventory-service-001
    
    # 协议配置
    protocol: HTTP
    
    # 路由匹配断言
    predicates:
      - type: PATH
        config:
          pattern: "/api/inventory/**"
      - type: METHOD
        config:
          methods: [GET, POST, PUT]
    
    # 负载均衡配置
    load-balance:
      strategy: ROUND_ROBIN
    
    # 过滤器配置
    filters:
      - type: REQUEST_LOG
        order: 100
        enabled: true
      - type: AUTH
        order: 200
        enabled: true
      - type: RATE_LIMIT
        order: 300
        enabled: true
        config:
          requests-per-second: 100
          burst-capacity: 200
    
    # 超时配置
    timeouts:
      connection: 3000
      request: 10000
      total: 20000
    
    # 路由元数据
    metadata:
      business-domain: "inventory-management"
  
  # ========== SDE管理服务路由 ==========
  - id: sde-admin-route
    name: "SDE管理服务"
    description: "SDE管理事件订阅API"
    order: 400
    enabled: true
    
    # 服务引用
    service-ref: sde-admin-service-001
    
    # 协议配置
    protocol: HTTP
    
    # 路由匹配断言
    predicates:
      - type: PATH
        config:
          pattern: "/sde/**"
          strip-prefix: 1
    
    # 负载均衡配置
    load-balance:
      strategy: ROUND_ROBIN
    
    # 过滤器配置
    filters:
      - type: REQUEST_LOG
        order: 100
        enabled: true
      - type: CORS
        order: 200
        enabled: true
    
    # 超时配置
    timeouts:
      connection: 5000
      request: 30000
      total: 60000
    
    # 路由元数据
    metadata:
      business-domain: "sde-admin"
  
  # ========== 默认兜底路由 ==========
  - id: default-fallback-route
    name: "默认兜底路由"
    description: "处理未匹配到其他路由的请求"
    order: 9999
    enabled: true
    
    # 服务引用
    service-ref: default-service-001
    
    # 协议配置
    protocol: HTTP
    
    # 路由匹配断言
    predicates:
      - type: PATH
        config:
          pattern: "/**"
    
    # 负载均衡配置
    load-balance:
      strategy: ROUND_ROBIN
    
    # 过滤器配置
    filters:
      - type: REQUEST_LOG
        order: 100
        enabled: true
    
    # 路由元数据
    metadata:
      business-domain: "system"
      route-type: "fallback"

# ==================== 全局过滤器 ====================
global-filters:
  - type: REQUEST_ID
    order: 10
    enabled: true
    config:
      header-name: "X-Request-ID"
      generate-if-missing: true
  
  - type: CORS
    order: 20
    enabled: true
    config:
      allowed-origins: ["*"]
      allowed-methods: [GET, POST, PUT, DELETE, OPTIONS]
      allowed-headers: ["*"]
      allow-credentials: true
      max-age: 3600
  
  - type: METRICS
    order: 30
    enabled: true
    config:
      collect-request-metrics: true
      collect-response-metrics: true

# ==================== 全局负载均衡默认配置 ====================
global-route-config:
  default-load-balance:
    strategy: ROUND_ROBIN
    config:
      reset-period: 3600000

# ==================== 监控配置 ====================
monitoring:
  metrics:
    enabled: true
    export-interval: 60000
    tags:
      application: "muxin-gateway"
      environment: "${ENVIRONMENT:development}"
  
  tracing:
    enabled: false
    sampling-rate: 0.1
    trace-header: "X-Trace-ID"
    span-header: "X-Span-ID"
  
  logging:
    level:
      root: INFO
      "com.muxin.gateway": DEBUG
    pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# ==================== 安全配置 ====================
security:
  jwt:
    secret: "${JWT_SECRET:muxin-gateway-secret-key-2024}"
    expiration: 3600000
    refresh-expiration: 86400000
    issuer: "muxin-gateway"
  
  rate-limit:
    default:
      requests-per-second: 1000
      burst-capacity: 2000

# ==================== 缓存配置 ====================
cache:
  enabled: true
  provider: "caffeine"
  default-ttl: 300000
  max-size: 10000
