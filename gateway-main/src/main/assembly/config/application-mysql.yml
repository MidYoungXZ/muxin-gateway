spring:
  datasource:
    url: jdbc:mysql://localhost:3306/muxin_gateway?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false

mybatis-flex:
  print-sql: false
  logic-delete-column: deleted
  logic-delete-value: 1
  logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.muxin.gateway.admin.entity
  global-config:
    print-banner: false
    audit-enable: true
  configuration:
    jdbc-type-for-null: NULL
    default-executor-type: REUSE