spring:
  application:
    name: muxin-gateway
  profiles:
    active: sqlite
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 604800
          must-revalidate: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /static/**, /assets/**, /css/**, /js/**, /images/**, /favicon.ico, /index.html, /*.html, /*.css, /*.js, /*.png, /*.jpg, /*.gif, /*.ico, /*.svg
        cache: true
        compressed: true
      static-locations: classpath:/static/
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: 10.100.0.140:9987
        enabled: true
        register-enabled: true
        service: ${spring.application.name}
        port: 8080
        weight: 1.0

# Sa-Token配置
sa-token:
  # token名称
  token-name: Authorization
  # token前缀
  token-prefix: Bearer
  # token有效期，单位秒，-1代表永不过期
  timeout: 2592000
  # token临时有效期（指定时间内无操作就过期），单位秒
  active-timeout: -1
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token
  is-share: true
  # 是否输出操作日志
  is-log: false
  # jwt密钥
  jwt-secret-key: muxin-gateway-jwt-secret-key-2024
  # 是否开启权限前缀匹配
  is-match-prefix: true

# Spring MVC Web服务器配置
server:
  port: 8080


# 网关配置
muxin:
  gateway:
    cloud:
      discovery: nacos
      config: nacos
    netty:
      server:
        port: 8081
        event-loop-group-boss-num: 1
        event-loop-group-worker-num: 4
        event-loop-group-boss-thread-pool-name: gateway-boss
        event-loop-group-worker-thread-pool-name: gateway-worker
        max-content-length: 67108864  # 64MB
        backlog: 1024
        re-use-address: true
        tcp-no-delay: true
        keep-alive: true
        snd-buf: 65535
        rcv-buf: 65535
      client:
        http-connect-timeout: 10000
        http-request-timeout: 30000
        http-max-request-retry: 3
        http-max-connections: 1000
        http-connections-per-host: 100
        http-pooled-connection-idle-timeout: 60000
        when-complete: false
    
    # 管理界面配置
    admin:
      enabled: true
      path-prefix: /admin
      username: admin
      password: admin123
      session-timeout: 30

# 日志配置
logging:
  level:
    com.muxin.gateway: info
    root: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html 