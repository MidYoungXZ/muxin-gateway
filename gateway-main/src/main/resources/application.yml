spring:
  application:
    name: muxin-gateway
  profiles:
    active: sqlite
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 604800
          must-revalidate: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /assets/**, /css/**, /js/**, /images/**, /favicon.ico, /*.html, /*.css, /*.js, /*.png, /*.jpg, /*.gif, /*.ico, /*.svg
        cache: true
        compressed: true
      static-locations: classpath:/static/
  cloud:
    nacos:
      username: nacos
      password: nacos
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        enabled: false
        register-enabled: false
        service: ${spring.application.name}
        port: 9191
        weight: 1.0

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 1800
  active-timeout: 1800
  is-concurrent: true
  is-share: true
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:${random.uuid}}
  is-match-prefix: true

server:
  port: 9191
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

muxin:
  gateway:
    cloud:
      discovery: local
      config: local
    netty:
      server:
        port: 9292
        event-loop-group-boss-num: 1
        event-loop-group-worker-num: 4
        event-loop-group-boss-thread-pool-name: gateway-boss
        event-loop-group-worker-thread-pool-name: gateway-worker
        max-content-length: 67108864
        backlog: 1024
        re-use-address: true
        tcp-no-delay: true
        keep-alive: true
        snd-buf: 65535
        rcv-buf: 65535
      client:
        http-connect-timeout: 10000
        http-request-timeout: 30000
        http-max-request-retry: 3
        http-max-connections: 1000
        http-connections-per-host: 100
        http-pooled-connection-idle-timeout: 60000
        when-complete: false
    admin:
      enabled: true
      path-prefix: /admin
      username: admin
      password: admin123
      session-timeout: 30

logging:
  level:
    com.muxin.gateway: info
    root: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html