# SQLite Configuration
# Using file-based SQLite database for persistent storage

spring:
  datasource:
    url: 'jdbc:sqlite:${user.dir}/data/muxin-gateway.db'
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

# MyBatis-Flex配置
mybatis-flex:
  print-sql: true
  logic-delete-column: deleted
  logic-delete-value: 1
  logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.muxin.gateway.admin.entity
  global-config:
    print-banner: false
    audit-enable: true
  configuration:
    jdbc-type-for-null: NULL
    default-executor-type: REUSE