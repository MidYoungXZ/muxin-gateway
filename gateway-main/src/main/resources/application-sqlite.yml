# SQLite Configuration
# Using in-memory SQLite database for development and testing

spring:
  datasource:
    url: 'jdbc:sqlite::memory:'
    driver-class-name: org.sqlite.JDBC
    # SQLite connection pool settings
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  sql:
    init:
      mode: always
      schema-locations: classpath:sql/sqlite_schema.sql
      data-locations: classpath:sql/sqlite_data.sql
      continue-on-error: false

# MyBatis-Flex配置
mybatis-flex:
  print-sql: true
  logic-delete-column: deleted
  logic-delete-value: 1
  logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.muxin.gateway.admin.entity
  global-config:
    print-banner: false
    audit-enable: true
  # SQLite兼容配置
  configuration:
    jdbc-type-for-null: NULL
    default-executor-type: REUSE